<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${titulo}">Registrar Resultado</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-4">
        <h1 th:text="${titulo}">Registrar Resultado del Partido</h1>
        
        <div class="card mb-4" th:if="${partido != null}">
            <div class="card-body">
                <h5 class="card-title text-center">Partido</h5>
                <div class="row text-center">
                    <div class="col-5">
                        <h4 th:text="${partido.equipoLocal.nombre}">Local</h4>
                    </div>
                    <div class="col-2">
                        <h4>VS</h4>
                    </div>
                    <div class="col-5">
                        <h4 th:text="${partido.equipoVisitante.nombre}">Visitante</h4>
                    </div>
                </div>
            </div>
        </div>
        
        <form th:action="@{/partidos/guardarResultado}" method="post">
            <input type="hidden" name="idPartido" th:value="${partido.idPartido}"/>
            
            <div class="row">
                <div class="col-md-6">
                    <label class="form-label" th:text="'Goles ' + ${partido.equipoLocal.nombre}">Goles Local:</label>
                    <input type="number" name="golesLocal" class="form-control" min="0" required/>
                </div>
                <div class="col-md-6">
                    <label class="form-label" th:text="'Goles ' + ${partido.equipoVisitante.nombre}">Goles Visitante:</label>
                    <input type="number" name="golesVisitante" class="form-control" min="0" required/>
                </div>
            </div>
            
            <button type="submit" class="btn btn-success mt-3">Guardar Resultado</button>
            <a th:href="@{/partidos/listar/{idGrupo}(idGrupo=${partido.grupo.idGrupo})}" class="btn btn-secondary mt-3">Cancelar</a>
        </form>
    </div>
</body>
</html>
