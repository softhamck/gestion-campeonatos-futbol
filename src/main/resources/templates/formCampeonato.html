<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${titulo}">Formulario Campeonato</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-4">
        <h1 th:text="${titulo}">Formulario Campeonato</h1>
        
        <form th:action="@{/campeonatos/guardar}" th:object="${campeonato}" method="post">
            <input type="hidden" th:field="*{idCampeonato}"/>
            
            <div class="mb-3">
                <label class="form-label">Nombre del Campeonato:</label>
                <input type="text" class="form-control" th:field="*{nombre}" required/>
            </div>
            
            <div class="mb-3">
                <label class="form-label">Fecha de Inicio:</label>
                <input type="date" class="form-control" th:field="*{fechaInicio}" required/>
            </div>
            
            <div class="mb-3">
                <label class="form-label">Fecha de Fin:</label>
                <input type="date" class="form-control" th:field="*{fechaFin}" required/>
            </div>
            
            <div class="mb-3">
                <label class="form-label">Estado:</label>
                <select class="form-control" th:field="*{estado}">
                    <option value="PENDIENTE">Pendiente</option>
                    <option value="EN_CURSO">En Curso</option>
                    <option value="FINALIZADO">Finalizado</option>
                </select>
            </div>
            
            <button type="submit" class="btn btn-success">Guardar</button>
            <a th:href="@{/campeonatos/listar}" class="btn btn-secondary">Cancelar</a>
        </form>
    </div>
</body>
</html>
