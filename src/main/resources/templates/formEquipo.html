<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${titulo}">Formulario Equipo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-4">
        <h1 th:text="${titulo}">Formulario Equipo</h1>
        
        <form th:action="@{/equipos/guardar}" th:object="${equipo}" method="post">
            <input type="hidden" th:field="*{idEquipo}"/>
            
            <div class="mb-3">
                <label class="form-label">Nombre del Equipo:</label>
                <input type="text" class="form-control" th:field="*{nombre}" required/>
            </div>
            
            <div class="mb-3">
                <label class="form-label">Ciudad:</label>
                <input type="text" class="form-control" th:field="*{ciudad}"/>
            </div>
            
            <div class="mb-3">
                <label class="form-label">Director Técnico:</label>
                <input type="text" class="form-control" th:field="*{directorTecnico}"/>
            </div>
            
            <div class="mb-3">
                <label class="form-label">Campeonato:</label>
                <select class="form-control" name="idCampeonato" required>
                    <option value="">Seleccione un campeonato</option>
                    <option th:each="campeonato : ${campeonatos}" 
                            th:value="${campeonato.idCampeonato}"
                            th:text="${campeonato.nombre}"
                            th:selected="${equipo.campeonato?.idCampeonato == campeonato.idCampeonato}">
                    </option>
                </select>
            </div>
            
            <button type="submit" class="btn btn-success">Guardar</button>
            <a th:href="@{/equipos/listar}" class="btn btn-secondary">Cancelar</a>
        </form>
    </div>
</body>
</html>
