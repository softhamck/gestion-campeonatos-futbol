<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${titulo}">Tabla de Posiciones</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-4">
        <h1 th:text="${titulo}">Tabla de Posiciones</h1>
        <h4 th:if="${grupo != null}" th:text="${grupo.nombre}">Grupo</h4>
        
        <table class="table table-striped table-bordered">
            <thead class="table-dark">
                <tr>
                    <th>Posición</th>
                    <th>Equipo</th>
                    <th>PJ</th>
                    <th>PG</th>
                    <th>PE</th>
                    <th>PP</th>
                    <th>GF</th>
                    <th>GC</th>
                    <th>DG</th>
                    <th>PTS</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="estadistica, iterStat : ${estadisticas}">
                    <td th:text="${iterStat.index + 1}">1</td>
                    <td th:text="${estadistica.key}">Equipo</td>
                    <td th:text="${estadistica.value['PJ']}">0</td>
                    <td th:text="${estadistica.value['PG']}">0</td>
                    <td th:text="${estadistica.value['PE']}">0</td>
                    <td th:text="${estadistica.value['PP']}">0</td>
                    <td th:text="${estadistica.value['GF']}">0</td>
                    <td th:text="${estadistica.value['GC']}">0</td>
                    <td th:text="${estadistica.value['GF'] - estadistica.value['GC']}">0</td>
                    <td>
                        <strong th:text="${estadistica.value['PTS']}">0</strong>
                    </td>
                </tr>
            </tbody>
        </table>
        
        <a th:href="@{/partidos/listar/{idGrupo}(idGrupo=${grupo.idGrupo})}" class="btn btn-secondary">Volver a Partidos</a>
        <a th:href="@{/campeonatos/listar}" class="btn btn-secondary">Volver a Campeonatos</a>
    </div>
</body>
</html>
