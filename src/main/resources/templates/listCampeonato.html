<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${titulo}">Campeonatos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-4">
        <h1 th:text="${titulo}">Gestión de Campeonatos</h1>
        
        <a th:href="@{/campeonatos/nuevo}" class="btn btn-primary mb-3">Nuevo Campeonato</a>
        <a href="/" class="btn btn-secondary mb-3">Inicio</a>
        
        <table class="table table-striped">
            <thead class="table-dark">
                <tr>
                    <th>ID</th>
                    <th>Nombre</th>
                    <th>Fecha Inicio</th>
                    <th>Fecha Fin</th>
                    <th>Estado</th>
                    <th>Acciones</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="campeonato : ${campeonatos}">
                    <td th:text="${campeonato.idCampeonato}">1</td>
                    <td th:text="${campeonato.nombre}">Copa 2026</td>
                    <td th:text="${campeonato.fechaInicio}">2026-01-01</td>
                    <td th:text="${campeonato.fechaFin}">2026-12-31</td>
                    <td>
                        <span class="badge" th:classappend="${campeonato.estado == 'PENDIENTE' ? 'bg-warning' : (campeonato.estado == 'EN_CURSO' ? 'bg-success' : 'bg-secondary')}" 
                              th:text="${campeonato.estado}">PENDIENTE</span>
                    </td>
                    <td>
                        <a th:href="@{/campeonatos/editar/{id}(id=${campeonato.idCampeonato})}" class="btn btn-warning btn-sm">Editar</a>
                        <a th:href="@{/campeonatos/eliminar/{id}(id=${campeonato.idCampeonato})}" class="btn btn-danger btn-sm" 
                           onclick="return confirm('¿Eliminar este campeonato?')">Eliminar</a>
                        <a th:href="@{/grupos/listar/{idCampeonato}(idCampeonato=${campeonato.idCampeonato})}" class="btn btn-info btn-sm">Grupos</a>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</body>
</html>
