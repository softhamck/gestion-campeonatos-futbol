<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${titulo}">Equipos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-4">
        <h1 th:text="${titulo}">Gestión de Equipos</h1>
        
        <a th:href="@{/equipos/nuevo}" class="btn btn-primary mb-3">Nuevo Equipo</a>
        <a href="/" class="btn btn-secondary mb-3">Inicio</a>
        
        <table class="table table-striped">
            <thead class="table-dark">
                <tr>
                    <th>ID</th>
                    <th>Nombre</th>
                    <th>Ciudad</th>
                    <th>Director Técnico</th>
                    <th>Campeonato</th>
                    <th>Grupo</th>
                    <th>Acciones</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="equipo : ${equipos}">
                    <td th:text="${equipo.idEquipo}">1</td>
                    <td th:text="${equipo.nombre}">FC Barcelona</td>
                    <td th:text="${equipo.ciudad}">Barcelona</td>
                    <td th:text="${equipo.directorTecnico}">Xavi</td>
                    <td th:text="${equipo.campeonato.nombre}">Copa 2026</td>
                    <td th:text="${equipo.grupo?.nombre}">Sin grupo</td>
                    <td>
                        <a th:href="@{/equipos/editar/{id}(id=${equipo.idEquipo})}" class="btn btn-warning btn-sm">Editar</a>
                        <a th:href="@{/equipos/eliminar/{id}(id=${equipo.idEquipo})}" class="btn btn-danger btn-sm"
                           onclick="return confirm('¿Eliminar este equipo?')">Eliminar</a>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</body>
</html>
